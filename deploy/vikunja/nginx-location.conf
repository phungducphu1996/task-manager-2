# Paste these locations inside the existing `server { ... }` block for hazeleo.com.
# Keep existing /task/ and /task-api/ locations unchanged.

location = /vikunja {
    return 301 /vikunja/;
}

location ^~ /hazeleo-assets/ {
    alias /opt/vikunja/assets/;
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location = /favicon.ico {
    alias /opt/vikunja/assets/hazeleo-favicon.png;
    default_type image/png;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location /vikunja/ {
    proxy_pass http://127.0.0.1:3456/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /vikunja;
    proxy_set_header Accept-Encoding "";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter 'Vikunja' 'Hazeleo';

    client_max_body_size 100M;
}
